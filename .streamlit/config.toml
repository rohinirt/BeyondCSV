[theme]
base = "light"
primaryColor = "#4338ca"
backgroundColor = "#f5f6fb"
secondaryBackgroundColor = "#eef0f8"
textColor = "#161a2c"

[server]
# Files are read in the visitor's browser, so this limit does not apply to
# BeyondCSV uploads. Kept at Streamlit's maximum-friendly value for any future
# st.file_uploader use.
maxUploadSize = 1000
enableXsrfProtection = true

[browser]
gatherUsageStats = false
