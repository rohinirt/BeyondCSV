<style>
/* Layout: SaaS workspace. Fixed left sidebar, sticky top bar, one scrolling content column.
   On phones the sidebar becomes a horizontally scrolling strip above the top bar. */
:root {
  --bg: #f1f7f7; --surface: #ffffff; --surface2: #e6f1f1; --fg: #0e2a2d; --muted: #4d6a6d; --line: #d2e3e4;
  --accent: #0f766e; --accent-soft: #d8f0ed; --on-accent: #ffffff; --on-strong: #ffffff;
  --good: #15803d; --good-soft: #def5e5; --warn: #b45309; --warn-soft: #fdf0d9; --bad: #b91c1c; --bad-soft: #fbe3e3;
  --c1: #0f8f94; --c2: #4f7cac; --c3: #d97706; --c4: #e11d48; --c5: #0284c7; --c6: #65a30d;
  --shadow: 0 1px 2px rgba(14, 42, 45, 0.05), 0 4px 14px rgba(14, 42, 45, 0.05);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1819; --surface: #112426; --surface2: #183134; --fg: #e6f4f3; --muted: #93b2b3; --line: #21403f;
    --accent: #2dd4bf; --accent-soft: #11403e; --on-accent: #062524; --on-strong: #062524;
    --good: #4ade80; --good-soft: #14301f; --warn: #fbbf24; --warn-soft: #382c12; --bad: #f87171; --bad-soft: #3b1a1e;
    --c1: #2dd4bf; --c2: #7fb0e0; --c3: #fbbf24; --c4: #fb7185; --c5: #38bdf8; --c6: #a3e635;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1819; --surface: #112426; --surface2: #183134; --fg: #e6f4f3; --muted: #93b2b3; --line: #21403f;
  --accent: #2dd4bf; --accent-soft: #11403e; --on-accent: #062524; --on-strong: #062524;
  --good: #4ade80; --good-soft: #14301f; --warn: #fbbf24; --warn-soft: #382c12; --bad: #f87171; --bad-soft: #3b1a1e;
  --c1: #2dd4bf; --c2: #7fb0e0; --c3: #fbbf24; --c4: #fb7185; --c5: #38bdf8; --c6: #a3e635;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14.5px; line-height: 1.5; padding-block: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, h4 { font-family: var(--font-display); letter-spacing: -0.015em; margin: 0; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg text { font-family: var(--font-body); }

.shell { display: grid; grid-template-columns: 252px minmax(0, 1fr); gap: 0 28px; max-width: 1360px; margin: 0 auto; min-height: 100vh; }
.side { position: sticky; top: 0; align-self: start; height: 100vh; padding: 22px 0; display: flex; flex-direction: column; gap: 22px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; letter-spacing: -0.02em; }
.logo { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 600; padding: 10px 10px 4px; }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 10px; border: 0; border-radius: 9px; background: none; color: var(--muted); cursor: pointer; font-size: 0.9rem; font-weight: 500; }
.nav-item svg { width: 17px; height: 17px; flex: none; }
.nav-item:hover:not(:disabled) { background: var(--surface2); color: var(--fg); }

.nav-item:disabled { opacity: 0.55; cursor: default; }
.nav-item .soon { margin-left: auto; white-space: nowrap; font-size: 0.64rem; font-family: var(--font-mono); background: var(--surface2); color: var(--muted); padding: 1px 6px; border-radius: 99px; }
.side-foot { margin-top: auto; font-size: 0.76rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
.side-foot b { display: block; color: var(--fg); font-size: 0.82rem; overflow-wrap: anywhere; }

.main { min-width: 0; padding-bottom: 64px; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 0; background: var(--bg); border-bottom: 1px solid var(--line); }
.crumb { font-size: 0.82rem; color: var(--muted); margin-right: auto; }
.crumb b { color: var(--fg); font-weight: 600; }
.ds-pick { display: flex; align-items: center; gap: 8px; }
.ds-pick select { max-width: 230px; }
.page { display: flex; flex-direction: column; gap: 12px; padding-top: 12px; }

.page-head p { margin: 2px 0 0; color: var(--muted); max-width: 80ch; font-size: 0.84rem; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: none; padding: 9px 14px; color: var(--muted); font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); min-width: 0; }
.card > h3 { font-size: 1.02rem; margin-bottom: 2px; }
.card .sub { color: var(--muted); font-size: 0.83rem; margin: 0 0 14px; }
.grid { display: grid; gap: 12px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: start; }
.split.wide-left { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
.split.colside { grid-template-columns: minmax(0, 300px) minmax(0, 1fr); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.sp { flex: 1; }
.label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }

.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }
.kpi .k { color: var(--muted); font-size: 0.78rem; }
.kpi .v { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; line-height: 1.2; }
.kpi .n { color: var(--muted); font-size: 0.76rem; }
.kpi.warn .v { color: var(--warn); } .kpi.bad .v { color: var(--bad); } .kpi.good .v { color: var(--good); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 500; font-size: 0.86rem; padding: 7px 13px; border-radius: 9px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--fg); white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover:not(:disabled) { color: var(--on-accent); filter: brightness(1.08); }
.btn.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
.btn.sm { padding: 4px 9px; font-size: 0.8rem; }
.btn.ghost { border-color: transparent; background: none; }
.btn svg { width: 15px; height: 15px; }
input[type=text], input[type=number], input[type=date], select, textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 10px; min-width: 0; max-width: 100%; }
input[type=number] { width: 110px; }
select { padding-right: 6px; }
textarea { width: 100%; font-family: var(--font-mono); font-size: 0.78rem; line-height: 1.45; resize: vertical; background: var(--surface2); }
input[type=checkbox], input[type=radio] { accent-color: var(--accent); width: 16px; height: 16px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; color: var(--muted); min-width: 0; }
label.chk { display: inline-flex; gap: 7px; align-items: center; font-size: 0.86rem; cursor: pointer; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 13px; cursor: pointer; font-size: 0.84rem; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

.drop { border: 2px dashed var(--accent); background: var(--accent-soft); border-radius: 18px; padding: 56px 24px; min-height: 230px; justify-content: center; gap: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; cursor: pointer; transition: background .15s; }
.drop:hover, .drop.over { background: var(--surface2); }
.drop strong { font-size: 1.02rem; } .drop span { color: var(--muted); font-size: 0.84rem; }
details.adv { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; }
details.adv summary { cursor: pointer; font-weight: 500; }
.msgs { display: flex; flex-direction: column; gap: 8px; }
.msg { border-radius: 10px; padding: 9px 13px; font-size: 0.88rem; border: 1px solid var(--line); background: var(--surface); }
.msg.err { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.msg.ok { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.msg.warn { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.msg.info { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.empty { border: 1px dashed var(--line); border-radius: 14px; padding: 34px 20px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 12px; }
.empty h3 { color: var(--fg); }
.qa { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 15px 16px; box-shadow: var(--shadow); }
.qa:hover { border-color: var(--accent); }
.qa .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.qa .ic svg { width: 18px; height: 18px; }
.qa b { font-size: 0.95rem; } .qa span.d { color: var(--muted); font-size: 0.82rem; }

.tablewrap { overflow: auto; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); max-height: 440px; }
table { border-collapse: collapse; width: 100%; font-size: 0.83rem; }
th, td { text-align: left; padding: 7px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { position: sticky; top: 0; background: var(--surface2); font-weight: 600; z-index: 1; font-size: 0.78rem; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
tbody tr.pick { cursor: pointer; } tbody tr.pick:hover td { background: var(--surface2); } tbody tr.sel td { background: var(--accent-soft); }
td.na { color: var(--muted); font-style: italic; } .mono { font-family: var(--font-mono); font-size: 0.78rem; }
td.rn { color: var(--muted); font-size: 0.74rem; width: 1%; }

.badge { display: inline-block; font-size: 0.68rem; font-weight: 600; padding: 1px 8px; border-radius: 99px; background: var(--surface2); color: var(--muted); vertical-align: middle; }
.badge.numeric { background: var(--accent-soft); color: var(--accent); }
.badge.datetime { background: var(--warn-soft); color: var(--warn); }
.badge.boolean { background: var(--good-soft); color: var(--good); }
.badge.categorical { background: var(--surface2); color: var(--fg); }
.badge.empty { background: var(--bad-soft); color: var(--bad); }
.pill { font-size: 0.72rem; padding: 1px 8px; border-radius: 99px; background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.chip { display: inline-block; border: 1px solid var(--line); border-radius: 99px; padding: 1px 10px; font-size: 0.78rem; font-family: var(--font-mono); margin: 0 5px 5px 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: top; }
.chips { display: flex; flex-wrap: wrap; }
.meter { height: 7px; border-radius: 4px; background: var(--surface2); overflow: hidden; min-width: 60px; }
.meter i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.meter.m-warn i { background: var(--warn); }
.pct { display: flex; align-items: center; gap: 8px; } .pct .meter { flex: 1; } .pct span { font-size: 0.78rem; color: var(--muted); width: 44px; text-align: right; font-variant-numeric: tabular-nums; }

.health { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 22px; align-items: center; }
.health .parts { display: flex; flex-direction: column; gap: 11px; }
.part .t { display: flex; justify-content: space-between; font-size: 0.84rem; margin-bottom: 4px; }
.part .t span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
.ringn { font-family: var(--font-display); font-size: 34px; font-weight: 700; fill: var(--fg); } .ringl { font-size: 11px; fill: var(--muted); }
.verdict { font-weight: 600; }

.statgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 8px; }
.stat { border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; background: var(--surface); }
.stat .k { font-size: 0.72rem; color: var(--muted); } .stat .v { font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.collist { max-height: 620px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; margin: 0 -6px; padding: 0 6px; }
.colbtn { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 8px 10px; border: 0; background: none; border-radius: 9px; cursor: pointer; }
.colbtn:hover { background: var(--surface2); } .colbtn.on { background: var(--accent-soft); }
.colbtn .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.colbtn small { color: var(--muted); font-size: 0.72rem; }
.vcrow { display: grid; grid-template-columns: minmax(70px, 1.2fr) 52px 1fr; gap: 10px; align-items: center; font-size: 0.83rem; padding: 3px 0; }
.vcrow .v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .vcrow .c { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }

.chart { display: block; width: 100%; height: auto; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; } .chart .axis { stroke: var(--muted); stroke-width: 1; opacity: .6; }
.chart .ax { fill: var(--muted); font-size: 11px; } .chart .axt { fill: var(--muted); font-size: 11.5px; font-weight: 500; }
.chart .val { fill: var(--fg); font-size: 11.5px; font-variant-numeric: tabular-nums; } .chart .lbl { fill: var(--fg); }
.chart .bar { opacity: .9; } .chart .bar:hover, .chart .box:hover { opacity: 1; filter: brightness(1.12); }
.chart .ref { stroke: var(--fg); stroke-width: 1.4; stroke-dasharray: 5 4; opacity: .75; } .chart .reflbl { fill: var(--fg); font-size: 11px; }
.chart .whisk { stroke: var(--muted); stroke-width: 1.4; } .chart .med { stroke: var(--bg); stroke-width: 2.4; }
.chart .box { opacity: .85; stroke: var(--surface); } .chart .out { fill: none; stroke: var(--muted); stroke-width: 1.3; }
.chart .pt { opacity: .6; } .chart .pt:hover { opacity: 1; } .chart .hv { font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
.chart-host { min-width: 0; width: 100%; } .chart-empty { display: grid; place-items: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 11px; padding: 20px; text-align: center; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 0.78rem; color: var(--muted); } .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; }
.ctrls { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 14px; }
.pickchips { display: flex; flex-wrap: wrap; gap: 6px; }
.pickchips label { border: 1px solid var(--line); border-radius: 99px; padding: 2px 11px; font-size: 0.8rem; cursor: pointer; background: var(--surface); }
.pickchips label:has(input:checked) { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.pickchips input { position: absolute; opacity: 0; pointer-events: none; }

.cond { display: grid; grid-template-columns: minmax(110px, 1.2fr) minmax(120px, 1.1fr) minmax(90px, 1.3fr) auto; gap: 8px; align-items: center; }
.cond .vals { display: flex; gap: 6px; min-width: 0; } .cond .vals input { flex: 1; min-width: 0; width: auto; }
.cond .vals .and { color: var(--muted); align-self: center; font-size: 0.8rem; }
.cond-err { color: var(--bad); font-size: 0.78rem; margin: -4px 0 0; }
.colrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.colrow.gone input[type=text] { text-decoration: line-through; opacity: .55; }
.colrow input[type=text] { width: 100%; } .colrow .acts { display: flex; gap: 4px; }
.partrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.partrow:last-child { border-bottom: 0; } .partrow .nm { font-weight: 600; overflow-wrap: anywhere; } .partrow .d { color: var(--muted); font-size: 0.8rem; }
.fmtcard { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 13px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.fmtcard[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.fmtcard:disabled { opacity: .55; cursor: default; } .fmtcard b { font-size: 0.92rem; } .fmtcard span { font-size: 0.76rem; color: var(--muted); }
.pager { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; color: var(--muted); flex-wrap: wrap; }
.hist { display: flex; flex-direction: column; gap: 6px; font-size: 0.83rem; } .hist .h { display: flex; gap: 8px; align-items: baseline; } .hist .h.future { opacity: .45; }
.hist .h b { font-weight: 600; } .hist .h span { color: var(--muted); } .hist .h time { margin-left: auto; color: var(--muted); font-size: 0.74rem; font-variant-numeric: tabular-nums; }

#tip { position: fixed; z-index: 100; pointer-events: none; background: var(--fg); color: var(--bg); padding: 6px 9px; border-radius: 8px; font-size: 0.78rem; line-height: 1.4; white-space: pre; max-width: 300px; opacity: 0; transition: opacity .08s; }
#tip.on { opacity: 1; }
#toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 90; max-width: min(380px, calc(100vw - 32px)); }
.toast { background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 11px; font-size: 0.86rem; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25); }
.toast.err { background: var(--bad); color: #fff; }

@media (max-width: 960px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; flex-direction: row; align-items: center; gap: 12px; padding: 12px 0 4px; overflow: visible; }
  .brand span.t { display: none; }
  .topbar { position: static; } .crumb { display: none; }
  .nav { flex-direction: row; overflow-x: auto; scrollbar-width: none; flex: 1; } .nav-label { display: none; }
  .nav-item { width: auto; white-space: nowrap; padding: 7px 11px; } .nav-item .soon { display: none; } .nav-item.later { display: none; }
  .side-foot { display: none; }
  .split, .split.wide-left, .split.colside { grid-template-columns: minmax(0, 1fr); }
  .health { grid-template-columns: minmax(0, 1fr); justify-items: center; } .health .parts { width: 100%; }
}

    if (!s.length) return NaN;

/* ------------------------------------------------------------ Columns */

/* ------------------------------------------------------------ Split */

/* outliers */
BUILD['clean.out'] = (t) => { const o = U.c.out, cols = keepCols('c.out.cols', t); if (!cols.length) return hint('Choose at least one numeric column.'); if (!(Number(o.k) > 0)) return err('The threshold must be greater than zero.'); return { type: 'outliers', params: { cols, method: o.method, k: Number(o.k), action: o.action } }; };

    const lo = method === 'zscore' ? st.mean - k * st.std : st.q1 - k * st.iqr, hi = method === 'zscore' ? st.mean + k * st.std : st.q3 + k * st.iqr, num = BC.numCol(t, i);
    why.push(method === 'zscore' ? `${c}: mean ${F(st.mean, 4)}, standard deviation ${F(st.std, 4)}, so values below ${F(lo, 4)} or above ${F(hi, 4)} (mean ± ${k} × SD) are outliers.` : `${c}: Q1 = ${F(st.q1, 4)}, Q3 = ${F(st.q3, 4)}, IQR = ${F(st.iqr, 4)}, so values below ${F(lo, 4)} (Q1 − ${k} × IQR) or above ${F(hi, 4)} (Q3 + ${k} × IQR) are outliers.`);

  });

}
BUILD['clean.out'] = (t) => { const o = U.c.out, cols = keepCols('c.out.cols', t); if (!cols.length) return hint('Choose at least one numeric column.'); if (!(Number(o.k) > 0)) return err('The threshold must be greater than zero.'); return { type: 'outliers', params: { cols, method: o.method, k: Number(o.k), action: o.action } }; };

function replay(d, steps) {
  let t = tbl(); const out = [];
  steps.forEach((s, i) => {
    if (!OP.defs[s.type]) throw new Error(`Step ${i + 1} uses an unknown operation (${s.type}).`);
    try { const { params, result } = OP.exec(s.type, t, s.params); out.push({ label: OP.defs[s.type].label, detail: OP.defs[s.type].describe(params), table: result.t, op: { type: s.type, params, rows: result.rows, cols: result.cols } }); t = result.t; }
    catch (e) { throw new Error(`Step ${i + 1} (${s.label || OP.defs[s.type].label}) could not run: ${e.message}`); }
  });
  return out;
}

  'script-copy': () => copyText(scriptText()),
  'script-dl': () => saveFile(`${baseName(ds().name)}_clean_data.txt`, scriptText()),
  'script-zip': () => { const d = ds(); saveFile(`${baseName(d.name)}_script.zip`, WR.zip([{ name: 'clean_data.py', data: scriptText() }, { name: d.name, data: originalCsv(d) }])); },
  'exp-xlsx': async () => { try { saveFile(`${baseName(ds().name)}${ds().idx ? '_edited' : ''}.xlsx`, await xlsxBytes(tbl())); } catch (e) { toast(e.message, 'err'); } },
  'exp-json': () => saveFile(`${baseName(ds().name)}${ds().idx ? '_edited' : ''}.json`, BC.toJSON(tbl())),
  bundle: () => {
    const d = ds(), base = baseName(d.name), steps = flowSteps(d).filter((h) => REUSABLE(h.op.type)), m = reportModel();
    const files = [{ name: `${base}_cleaned.csv`, data: BC.toDelimited(tbl(), ',') }, { name: d.name, data: originalCsv(d) }, { name: 'quality_report.html', data: RP.toHTML(m) }, { name: 'clean_data.py', data: scriptText() }];
    if (steps.length) files.push({ name: 'workflow.json', data: workflowJSON(base, steps) });
    saveFile(`${base}_bundle.zip`, WR.zip(files));
  },
  'flow-save': () => {
    const d = ds(), steps = flowSteps(d).filter((h) => REUSABLE(h.op.type)), name = U.c.flow.name.trim() || `Workflow ${S.workflows.length + 1}`; if (!steps.length) return;
    S.workflows.push({ id: 'w' + Date.now().toString(36), name, steps: steps.map((h) => ({ type: h.op.type, params: h.op.params, label: h.label, detail: h.detail })) }); U.c.flow.name = ''; S.flowErr = '';
    toast(saveFlows() ? `Saved workflow "${name}"` : `Saved "${name}" for this session only. Browser storage is unavailable, so use Export to keep it.`); renderView();
  },
  'flow-del': (el) => { S.workflows = S.workflows.filter((w) => w.id !== el.dataset.id); saveFlows(); renderView(); },
  'flow-export': (el) => { const w = S.workflows.find((x) => x.id === el.dataset.id); if (w) saveFile(`${BC.slug ? BC.slug(w.name) : w.name}_workflow.json`, JSON.stringify({ app: 'BeyondCSV', version: 1, name: w.name, steps: w.steps }, null, 2)); },
  'flow-current': () => { const d = ds(), steps = flowSteps(d).filter((h) => REUSABLE(h.op.type)); if (!steps.length) { toast('Apply at least one step first.', 'err'); return; } saveFile(`${baseName(d.name)}_workflow.json`, workflowJSON(baseName(d.name), steps)); },
  'flow-apply': (el) => {
    const w = S.workflows.find((x) => x.id === el.dataset.id), d = ds(); if (!w) return;
    try {
      const made = replay(d, w.steps); S.flowErr = '';
      d.hist = d.hist.slice(0, d.idx + 1); made.forEach((m) => d.hist.push({ t: m.table, label: m.label, detail: m.detail, at: new Date(), op: m.op }));
      while (d.hist.length > MAX_HIST) d.hist.splice(1, 1);
      d.idx = d.hist.length - 1; resetEphemeral(); render(); toast(`Applied "${w.name}": ${made.length} step${made.length === 1 ? '' : 's'} → ${N(tbl().rows.length)} rows`);
    } catch (e) { S.flowErr = e.message + ' Nothing was changed.'; renderView(); }
  },
});
Object.assign(CHECK_ACT, {
  cpick: (el) => { const a = get(el.dataset.path), c = el.dataset.col; setPath(el.dataset.path, el.checked ? [...a.filter((x) => x !== c), c] : a.filter((x) => x !== c)); schedulePrev(); updateDeps(); },
  'inc-canon': (el) => { const c = U.c.inc, k = el.dataset.key; c.cust = c.cust || {}; if (el.value === '__custom__') { c.cust[k] = true; } else { c.cust[k] = false; c.pick[k] = el.value; } renderView(); },
  'inc-custom': (el) => { const c = U.c.inc, k = el.dataset.key, v = el.value.trim(); if (v) { c.pick[k] = v; } else { delete c.pick[k]; c.cust[k] = false; } renderView(); },
  'inc-skip': (el) => { U.c.inc.skip[el.dataset.key] = !el.checked; schedulePrev(); },
});
function updateDeps() { /* selection-dependent text (e.g. outlier limits, combine order) */ if ((S.page === 'clean' && ['out', 'miss', 'dup'].includes(S.tab.clean)) || (S.page === 'xform' && ['combine', 'group'].includes(S.tab.xform))) renderView(); }
document.addEventListener('change', (e) => {
  const el = e.target; if (el.id !== 'wfImport') return; const f = el.files[0]; el.value = ''; if (!f) return;
  f.text().then((txt) => {
    const j = JSON.parse(txt); if (!j || !Array.isArray(j.steps) || !j.steps.length || !j.steps.every((s) => s && OP.defs[s.type] && s.params)) throw new Error('That file is not a BeyondCSV workflow.');
    S.workflows.push({ id: 'w' + Date.now().toString(36), name: String(j.name || f.name.replace(/\.json$/i, '')).slice(0, 80), steps: j.steps.map((s) => ({ type: s.type, params: s.params, label: s.label || OP.defs[s.type].label, detail: s.detail || '' })) }); saveFlows(); S.flowErr = ''; toast('Workflow imported'); renderView();
  }).catch((er) => { S.flowErr = er instanceof SyntaxError ? 'That file is not valid JSON.' : er.message; renderView(); });
});
/* ------------------------------------------------------------ startup */
$('#root').innerHTML = '<div class="shell"><aside class="side" id="side"></aside><div class="main"><div class="topbar" id="top"></div><main class="page" id="view"></main></div></div>';
ingest(new TextEncoder().encode(BC.sampleCustomers()), 'beyondcsv_sample_customers.csv', {}, true);
ingest(new TextEncoder().encode(BC.sampleOrders()), 'beyondcsv_sample_orders.csv', {}, true);
render();
if (window.__bcTest) window.__bc = { S, U, ACT, BC, OP, RP, WR, ds, tbl, BUILD, PREVX };
})();
</script>
